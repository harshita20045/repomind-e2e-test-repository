[project]
name = "repomind-e2e-test-repository"
version = "0.1.0"
description = "Standalone FastAPI fixture for repository analysis and PR review testing"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
